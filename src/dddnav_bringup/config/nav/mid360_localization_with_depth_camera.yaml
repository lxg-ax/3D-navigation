# mid360_localization with a *non-semantic* depth camera plugin to fill in
# the LiDAR near-field blind zone (table legs, low obstacles). MCL tuning is
# slightly looser here because the original profile was tuned for noisier
# depth bagfiles.

global_plan_manager:
  ros__parameters:
    global_planner_action_name: "get_dwa_plan"
    global_plan_query_frequency: 5.0

mcl_ip:
  ros__parameters:
    imageProjection:
      stitcher_num: 3                 # combine 3 frames before feature ext

mcl_3dl:
  ros__parameters:
    update_min_d: 0.2
    update_min_a: 0.15
    lpf_step: 2.0
    likelihood:
      num_points_global: 8
      match_dist_min: 0.3
      match_dist_flat: 0.05
      threshold_for_trusted_ground: 6
      radius_of_ground_search: 1.0

perception_3d_local:
  ros__parameters:
    global_frame: "map"
    robot_base_frame: "base_link"
    max_obstacle_distance: 9999.0
    inscribed_radius: 0.5
    inflation_descending_rate: 2.0
    inflation_radius: 1.5
    sensors_collected_frequency: 10.0
    plugins: ["map", "path_blocked_strategy", "lidar", "depth_camera"]
    map:
      plugin: "perception_3d::StaticLayer"
      is_local_planner: true
      mapping_mode: false
      map_topic: "mapcloud"
      ground_topic: "mapground"
    path_blocked_strategy:
      plugin: "perception_3d::PathBlockedStrategy"
      check_radius: 0.3
    lidar:
      plugin: "perception_3d::MultiLayerSpinningLidar"
      is_local_planner: true
      topic: "segmented_cloud_pure"
      pub_gbl_marking_for_visualization: false
      vertical_FOV_top: 52.0
      vertical_FOV_bottom: -7.0
      scan_effective_positive_start: 30.0
      scan_effective_positive_end: 180.0
      scan_effective_negative_start: -30.0
      scan_effective_negative_end: -180.0
      resolution: 0.05
      height_resolution: 0.05
      marking_height: 2.0
      perception_window_size: 3.0
      segmentation_ignore_ratio: 0.5
      expected_sensor_time: 0.2
    depth_camera:
      plugin: "perception_3d::DepthCameraLayer"
      is_local_planner: true
      pub_gbl_marking_for_visualization: false
      pub_gbl_marking_frequency: 10.0
      euclidean_cluster_extraction_tolerance: 0.1
      euclidean_cluster_extraction_min_cluster_size: 1
      xy_resolution: 0.05
      height_resolution: 0.05
      perception_window_size: 3.0
      segmentation_ignore_ratio: 0.5
      observation_sources: front_camera
      front_camera:
        topic: "/depthimg2pointcloud_front/point_cloud_from_depth"
        sensor_frame: "camera_link"
        observation_persistence: 0.0
        expected_update_rate: 0.1
        min_obstacle_height: 0.05
        max_obstacle_height: 2.0
        obstacle_max_range: 4.0
        obstacle_min_range: 0.3
        FOV_W: 1.5184
        FOV_V: 1.0123

perception_3d_global:
  ros__parameters:
    global_frame: "map"
    robot_base_frame: "base_link"
    max_obstacle_distance: 9999.0
    inscribed_radius: 0.5
    inflation_descending_rate: 2.0
    inflation_radius: 1.5
    sensors_collected_frequency: 10.0
    plugins: ["map", "lidar"]
    dgraph_publish_frequency: 1.0
    map:
      plugin: "perception_3d::StaticLayer"
      is_local_planner: false
      use_adaptive_connection: false
      adaptive_connection_number: 20
      radius_of_ground_connection: 1.5
      intensity_search_radius: 1.0
      intensity_search_punish_weight: 0.1
      static_imposing_radius: 1.5
      map_topic: "mapcloud"
      ground_topic: "mapground"
      support:
        mapping_mode: false
        enable_edge_detection: true
        generate_static_graph: false
    lidar:
      plugin: "perception_3d::MultiLayerSpinningLidar"
      is_local_planner: false
      topic: "segmented_cloud_pure"
      pub_gbl_marking_for_visualization: true
      vertical_FOV_top: 15.0
      vertical_FOV_bottom: -15.0
      scan_effective_positive_start: 30.0
      scan_effective_positive_end: 180.0
      scan_effective_negative_start: -30.0
      scan_effective_negative_end: -180.0
      euclidean_cluster_extraction_tolerance: 0.1
      euclidean_cluster_extraction_min_cluster_size: 1
      xy_resolution: 0.05
      height_resolution: 0.05
      marking_height: 2.0
      perception_window_size: 5.0
      segmentation_ignore_ratio: 1.1
      expected_sensor_time: 0.1

global_planner:
  ros__parameters:
    use_pre_graph: true
