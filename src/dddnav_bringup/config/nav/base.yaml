# Mid360 nav stack: shared base layer.
#
# Every profile in this directory is loaded as: [base.yaml, profile.yaml].
# ROS 2 honours later parameter files, so profiles only need to override the
# keys that actually differ (mode-specific topics, perception plugin lists,
# etc.). Keep robot-shape, controller-frequency and planner-graph defaults
# here; per-mode tuning belongs in the overlay.

p2p_move_base:
  ros__parameters:
    controller_frequency: 10.0
    planner_patience: 10.0
    oscillation_distance: 5.0
    oscillation_angle: 1.0
    oscillation_patience: 15.0
    controller_patience: 10.0
    no_plan_retry_num: 10
    waiting_patience: 10.0

# global_plan_manager 的 action 名称 / 重新规划频率因模式不同, profile 必须重写.
global_plan_manager:
  ros__parameters: {}

local_planner:
  ros__parameters:
    odom_topic: odom
    forward_prune: 3.0
    backward_prune: 1.0
    heading_tracking_distance: 0.5
    heading_align_angle: 0.5
    prune_plane_timeout: 3.0
    xy_goal_tolerance: 0.3
    yaw_goal_tolerance: 0.3
    controller_frequency: 10.0
    cuboid:
      flb: [0.42, 0.36, 0.0]   # front left bottom
      frb: [0.42, -0.36, 0.0]
      flt: [0.42, 0.36, 0.6]   # front left top
      frt: [0.42, -0.36, 0.6]
      blb: [-0.35, 0.36, 0.0]  # back left bottom
      brb: [-0.35, -0.36, 0.0]
      blt: [-0.35, 0.36, 0.6]
      brt: [-0.35, -0.36, 0.6]

recovery_behaviors:
  ros__parameters:
    plugins: ["rotate_inplace"]
    rotate_inplace:
      plugin: "recovery_behaviors::RotateInPlaceBehavior"
      frequency: 10.0
      tolerance: 0.3
      trajectory_generator_name: "differential_drive_rotate_inplace"

trajectory_generators:
  ros__parameters:
    plugins:
      - differential_drive_simple
      - differential_drive_rotate_inplace
      - differential_drive_rotate_shortest_angle
    differential_drive_rotate_shortest_angle:
      plugin: "trajectory_generators::DDRotateInplaceTheory"
      controller_frequency: 10.0
      rotation_speed: 0.5
      cuboid: &cuboid
        flb: [0.42, 0.36, 0.0]
        frb: [0.42, -0.36, 0.0]
        flt: [0.42, 0.36, 0.6]
        frt: [0.42, -0.36, 0.6]
        blb: [-0.35, 0.36, 0.0]
        brb: [-0.35, -0.36, 0.0]
        blt: [-0.35, 0.36, 0.6]
        brt: [-0.35, -0.36, 0.6]
    differential_drive_rotate_inplace:
      plugin: "trajectory_generators::DDRotateInplaceTheory"
      controller_frequency: 10.0
      rotation_speed: 0.5
      cuboid: *cuboid
    differential_drive_simple:
      plugin: "trajectory_generators::DDSimpleTrajectoryGeneratorTheory"
      max_vel_x: 1.0
      min_vel_x: 0.1                 # >0 so backwards uses a separate generator
      max_vel_theta: 0.6
      min_vel_theta: 0.15
      acc_lim_x: 1.0
      acc_lim_theta: 3.0
      deceleration_ratio: 2.0
      max_motor_shaft_rpm: 3000.0
      wheel_diameter: 0.16
      gear_ratio: 1.0
      robot_radius: 0.25
      controller_frequency: 10.0
      sim_time: 2.0
      linear_x_sample: 5.0
      angular_z_sample: 10.0
      sim_granularity: 0.1           # 10Hz @ 0.1m → ~20 collision points/traj
      angular_sim_granularity: 0.05
      cuboid: *cuboid

mpc_critics:
  ros__parameters:
    plugins:
      - collision
      - stick_path
      - pure_pursuit
      - toward_global_plan
      - collision_rotate
      - collision_rotate_shortest
      - prefer_rotate_shortest
    collision:
      plugin: "mpc_critics::CollisionModel"
      trajectory_generator: differential_drive_simple
      weight: 1.0
    stick_path:
      plugin: "mpc_critics::StickPathModel"
      trajectory_generator: differential_drive_simple
      weight: 0.1
    pure_pursuit:
      plugin: "mpc_critics::PurePursuitModel"
      trajectory_generator: differential_drive_simple
      translation_weight: 1.0
      orientation_weight: 0.01
    toward_global_plan:
      plugin: "mpc_critics::TowardGlobalPlanModel"
      trajectory_generator: differential_drive_simple
      weight: 1.0
    collision_rotate:
      plugin: "mpc_critics::CollisionModel"
      trajectory_generator: differential_drive_rotate_inplace
      weight: 1.0
    collision_rotate_shortest:
      plugin: "mpc_critics::CollisionModel"
      trajectory_generator: differential_drive_rotate_shortest_angle
      weight: 1.0
    prefer_rotate_shortest:
      plugin: "mpc_critics::ShortestAngleModel"
      trajectory_generator: differential_drive_rotate_shortest_angle
      weight: 1.0

global_planner:
  ros__parameters:
    turning_weight: 0.1
    enable_detail_log: false
    a_star_expanding_radius: 0.5

# Localization-only nodes (mapping profiles ignore them).
mcl_ip:
  ros__parameters:
    laser:
      odom_type: "laser_odometry"
      baselink_frame: "base_link"
      num_vertical_scans: 32
      num_horizontal_scans: 1000
      vertical_angle_bottom: -7.0
      vertical_angle_top: 52.0
      scan_period: 0.1
    imageProjection:
      segment_valid_point_num: 5
      segment_valid_line_num: 2
      segment_theta: 60.0
      minimum_detection_range: 0.5
      maximum_detection_range: 100.0
      distance_for_patch_between_rings: 1.0
      stitcher_num: 1                       # Mid360 frame already ~20k points
      trt_model_path: ""
      projected_image_stack_size: 1
      ground_fov_bottom: -0.2617994         # -15deg
      ground_fov_top: -0.087266             # -5deg
      ground_positive_start: 0.0
      ground_positive_stop: 3.1415926
      ground_negative_start: 0.0
      ground_negative_stop: -3.1415926

mcl_fa:
  ros__parameters:
    featureAssociation:
      edge_threshold: 0.1
      surf_threshold: 0.1
      nearest_feature_search_distance: 3.0

sub_maps:
  ros__parameters:
    # pose_graph_dir injected by dddnav_bringup localization*.launch.py.
    sub_map_search_radius: 50.0
    sub_map_warmup_trigger_distance: 20.0
    complete_map_voxel_size: 0.4

mcl_3dl:
  ros__parameters:
    init_x: 0.0
    init_y: 0.0
    init_z: 0.0
    init_roll: 0.0
    init_pitch: 0.0
    init_yaw: 0.0
    init_var_x: 2.0
    init_var_y: 2.0
    init_var_z: 0.5
    init_var_roll: 0.1
    init_var_pitch: 0.1
    init_var_yaw: 0.5
    map_frame: "map"
    robot_frame: "base_link"
    odom_frame: "odom"
    map_downsample_x: 0.1
    map_downsample_y: 0.1
    map_downsample_z: 0.1
    map_update_interval_sec: 2
    num_particles: 80                       # Mid360 cloud quality is good

    # Adaptive particle count.
    #   Steady state target = num_particles. The filter is allowed to grow
    #   up to num_particles_max when match_ratio drops below
    #   match_ratio_grow_thresh, and to expand to num_particles_grow_on_init
    #   immediately after a /initial_3d_pose so re-localisation has search
    #   budget. After that the count exponentially decays
    #   (size *= particle_decay each measurement) towards
    #   max(num_particles, num_particles_min).
    num_particles_min: 60
    num_particles_max: 400
    num_particles_grow_on_init: 400
    match_ratio_grow_thresh: 0.55
    particle_decay: 0.9
    resample_var_x: 0.2
    resample_var_y: 0.2
    resample_var_z: 0.2
    resample_var_yaw: 0.1
    resample_var_pitch: 0.2
    resample_var_roll: 0.2
    expansion_var_x: 0.5
    expansion_var_y: 0.5
    expansion_var_z: 0.5
    expansion_var_roll: 0.2
    expansion_var_pitch: 0.2
    expansion_var_yaw: 0.2
    match_ratio_thresh: 0.0
    euc_cluster_distance: 0.8
    euc_cluster_min_size: 3
    euc_cluster_max_size: 2400
    knn_num_of_ground_normals: 20
    update_min_d: 0.05                      # responsive at the cost of more CPU
    update_min_a: 0.05
    odom_err_lin_lin: 0.6
    odom_err_lin_ang: 0.3
    odom_err_ang_lin: 0.3
    odom_err_ang_ang: 0.6
    odom_err_integ_lin_tc: 5.0
    odom_err_integ_ang_tc: 10.0
    lpf_step: 4.0
    acc_lpf_step: 128.0
    jump_dist: 1.0
    jump_ang: 1.57
    bias_var_dist: 2.0
    bias_var_ang: 1.57
    tf_tolerance: 0.1
    publish_tf: true                        # localization launches override to false
    likelihood:
      num_points_global: 16
      match_dist_min: 0.2
      match_dist_flat: 0.05
      threshold_for_trusted_ground: 6
      radius_of_ground_search: 1.0

dynamic_window_aware_global_planner:
  ros__parameters:
    look_ahead_distance: 2.0
    recompute_frequency: 10.0
