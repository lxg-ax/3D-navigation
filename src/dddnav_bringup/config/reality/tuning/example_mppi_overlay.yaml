# tuning overlay: 把 dd_simple 替换/并行成 mppi 的最小示例
#
# 用法：把这一份覆盖在 p2p_move_base 的默认 yaml 之上：
#
#   ros2 launch dddnav_bringup navigation.launch.py \
#     p2p_move_base_yaml:=$(pwd)/src/dddnav_bringup/config/reality/tuning/example_mppi_overlay.yaml
#
# 注意点
# ------
# * 这个 overlay 只追加 differential_drive_mppi 这一个 generator，并把
#   一份 critic 复制绑到它身上。dd_simple / 旋转 generator 都保留，
#   p2p_move_base.cpp 默认仍调 "differential_drive_simple"。要让 mppi
#   生效，还需要在 p2p_move_base 那边把直行段的 traj_gen_name 切到
#   "differential_drive_mppi"（一行的事，但属于业务调度，故没塞进
#   overlay）。
# * 关键参数怎么调（见 dddnav_local_planner/README.md MPPI 一节）：
#     mppi.lambda  小 → 行为更激进，接近 argmin
#     mppi.lambda  大 → 行为更平滑，多样本平均
#     mppi.sigma_v / sigma_w 大 → 探索更大，但更可能撞 critic 的
#                                   "stick_path" 罚分
#     mppi.num_samples 越大越稳，cost ≈ N × dd_simple 单次代价。
#                      默认 64 已经能跑 10Hz；嵌入式可以降到 32。

trajectory_generators:
  ros__parameters:
    plugins:
      - "differential_drive_simple"
      - "differential_drive_rotate_inplace"
      - "differential_drive_rotate_shortest_angle"
      - "differential_drive_mppi"

    differential_drive_mppi:
      plugin: "trajectory_generators::MPPIDifferentialDriveTheory"

      # 与 dd_simple 同 schema：限速 / 加速度 / cuboid。
      max_vel_x: 1.0
      min_vel_x: 0.0          # MPPI 允许 0 速；min_vel_x 限的是硬下限
      max_vel_theta: 0.8
      min_vel_theta: -0.8
      acc_lim_x: 2.0
      acc_lim_theta: 3.0
      deceleration_ratio: 2.0
      use_motor_constraint: false
      robot_radius: 0.25

      controller_frequency: 10.0
      sim_time: 1.5
      sim_granularity: 0.1
      angular_sim_granularity: 0.05

      mppi:
        num_samples: 64
        lambda: 1.0
        sigma_v: 0.2
        sigma_w: 0.4
        reset_nominal_each_cycle: false
        min_valid_fraction: 0.1

      cuboid:
        flb: [0.42, 0.36, 0.0]
        frb: [0.42, -0.36, 0.0]
        flt: [0.42, 0.36, 0.6]
        frt: [0.42, -0.36, 0.6]
        blb: [-0.35, 0.36, 0.0]
        brb: [-0.35, -0.36, 0.0]
        blt: [-0.35, 0.36, 0.6]
        brt: [-0.35, -0.36, 0.6]

mpc_critics:
  ros__parameters:
    # 在原有 plugin 列表后面追加 4 个，名字必须不冲突。
    plugins:
      - "collision"
      - "stick_path"
      - "pure_pursuit"
      - "toward_global_plan"
      - "collision_rotate"
      - "collision_rotate_shortest"
      - "prefer_rotate_shortest"
      - "mppi_collision"
      - "mppi_stick_path"
      - "mppi_pure_pursuit"
      - "mppi_toward_global_plan"

    mppi_collision:
      plugin: "mpc_critics::CollisionModel"
      trajectory_generator: differential_drive_mppi
      weight: 1.0
    mppi_stick_path:
      plugin: "mpc_critics::StickPathModel"
      trajectory_generator: differential_drive_mppi
      weight: 0.1
    mppi_pure_pursuit:
      plugin: "mpc_critics::PurePursuitModel"
      trajectory_generator: differential_drive_mppi
      translation_weight: 1.0
      orientation_weight: 0.01
    mppi_toward_global_plan:
      plugin: "mpc_critics::TowardGlobalPlanModel"
      trajectory_generator: differential_drive_mppi
      weight: 1.0
