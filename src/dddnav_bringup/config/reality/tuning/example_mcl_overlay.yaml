# Overlay 模板：MCL 在长走廊/对称环境更激进
# 用法：nav_profile:=$(pwd)/src/dddnav_bringup/config/reality/tuning/example_mcl_overlay.yaml
# 默认值见 dddnav_bringup/config/nav_base.yaml + dddnav_mcl_3dl/README.md。

mcl_3dl:
  ros__parameters:
    match_ratio_grow_thresh: 0.65   # 翻倍门提高
    num_particles_max:       800    # 上限抬高
    num_particles_grow_on_init: 800 # 重定位预算更大
    particle_decay: 0.95            # 回落更慢，避免抖动
