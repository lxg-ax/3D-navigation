# Overlay 模板：pose_fusion 收紧（室内/慢速）
# 用法：pose_fusion_yaml:=$(pwd)/src/dddnav_bringup/config/reality/tuning/example_pose_fusion_overlay.yaml
# 默认值见 dddnav_pose_fusion/README.md。

/**:
  ros__parameters:
    proc_noise_pos:     0.02   # 减小过程噪声，ESKF 更信 LIO
    proc_noise_rot:     0.01
    mcl_cov_reject_trace: 1.0  # MCL cov trace > 1 m² 直接丢
    lio_blackout_sec:        0.5  # LIO 沉默 0.5s 进 DEGRADED_LIO_LOST
