
# Sim Velodyne (Gazebo Go2) localization profile. Defaults inherited from
# base.yaml; only differences from the Mid360 baseline are listed:
#   - perception layer reads /cloud_registered_body (no Livox bridge in sim)
#   - laser projection FOV / scan layout match VLP-16
#   - smaller voxel for the relatively sparse sim cloud

global_plan_manager:
  ros__parameters:
    global_planner_action_name: "get_dwa_plan"
    global_plan_query_frequency: 5.0

mcl_ip:
  ros__parameters:
    laser:
      odom_type: "laser_odometry"
      baselink_frame: "base_link"
      num_vertical_scans: 16
      num_horizontal_scans: 440
      vertical_angle_bottom: -15.0
      vertical_angle_top: 15.0
      scan_period: 0.1
    imageProjection:
      segment_valid_point_num: 5
      segment_valid_line_num: 2
      segment_theta: 60.0
      minimum_detection_range: 0.9
      maximum_detection_range: 80.0
      distance_for_patch_between_rings: 1.0
      stitcher_num: 1
      trt_model_path: ""
      projected_image_stack_size: 1
      ground_fov_bottom: -0.2617994
      ground_fov_top: -0.087266
      ground_positive_start: 0.0
      ground_positive_stop: 3.1415926
      ground_negative_start: 0.0
      ground_negative_stop: -3.1415926

perception_3d_local:
  ros__parameters:
    global_frame: "map"
    robot_base_frame: "base_link"
    max_obstacle_distance: 9999.0
    inscribed_radius: 0.5
    inflation_descending_rate: 2.0
    inflation_radius: 1.5
    sensors_collected_frequency: 10.0
    plugins: ["map", "path_blocked_strategy", "lidar"]
    map:
      plugin: "perception_3d::StaticLayer"
      is_local_planner: true
      mapping_mode: false
      map_topic: "mapcloud"
      ground_topic: "mapground"
    path_blocked_strategy:
      plugin: "perception_3d::PathBlockedStrategy"
      check_radius: 0.3
    lidar:
      plugin: "perception_3d::MultiLayerSpinningLidar"
      is_local_planner: true
      topic: "segmented_cloud_pure"
      pub_gbl_marking_for_visualization: false
      vertical_FOV_top: 15.0
      vertical_FOV_bottom: -15.0
      scan_effective_positive_start: 30.0
      scan_effective_positive_end: 180.0
      scan_effective_negative_start: -30.0
      scan_effective_negative_end: -180.0
      resolution: 0.05
      height_resolution: 0.05
      marking_height: 2.0
      perception_window_size: 3.0
      segmentation_ignore_ratio: 0.5
      expected_sensor_time: 0.2

perception_3d_global:
  ros__parameters:
    global_frame: "map"
    robot_base_frame: "base_link"
    max_obstacle_distance: 9999.0
    inscribed_radius: 0.5
    inflation_descending_rate: 2.0
    inflation_radius: 1.5
    sensors_collected_frequency: 10.0
    plugins: ["map", "lidar"]
    dgraph_publish_frequency: 1.0
    map:
      plugin: "perception_3d::StaticLayer"
      is_local_planner: false
      use_adaptive_connection: false
      adaptive_connection_number: 20
      radius_of_ground_connection: 1.5
      intensity_search_radius: 1.0
      intensity_search_punish_weight: 0.1
      static_imposing_radius: 1.5
      map_topic: "mapcloud"
      ground_topic: "mapground"
      support:
        mapping_mode: false
        enable_edge_detection: true
        generate_static_graph: false
    lidar:
      plugin: "perception_3d::MultiLayerSpinningLidar"
      is_local_planner: false
      topic: "segmented_cloud_pure"
      pub_gbl_marking_for_visualization: true
      vertical_FOV_top: 15.0
      vertical_FOV_bottom: -15.0
      scan_effective_positive_start: 30.0
      scan_effective_positive_end: 180.0
      scan_effective_negative_start: -30.0
      scan_effective_negative_end: -180.0
      euclidean_cluster_extraction_tolerance: 0.1
      euclidean_cluster_extraction_min_cluster_size: 1
      xy_resolution: 0.05
      height_resolution: 0.05
      marking_height: 2.0
      perception_window_size: 5.0
      segmentation_ignore_ratio: 1.1
      expected_sensor_time: 0.1

global_planner:
  ros__parameters:
    use_pre_graph: true
